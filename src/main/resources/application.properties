spring.application.name=Coffee-Shop

# Server configuration
server.port=8080

# Allow circular references (needed for BaristaAssignmentService <-> OrderCompletionService)
spring.main.allow-circular-references=true

# Simulation mode (for demo/testing only)
coffee.shop.simulation.enabled=true

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.coffeeShop.Coffee.Shop=DEBUG
